name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    # The audit takes well under a minute on a quiet runner; this stops a
    # stall from silently burning the job's full six-hour allowance.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # Fails on any serious or critical WCAG 2.1 AA violation, so the
      # /accessibility commitment cannot silently regress.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Accessibility (axe-core)
        run: npm run a11y
